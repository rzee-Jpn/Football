<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TTS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0e0c;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .grid-container {
      overflow: auto;
      margin-bottom: 20px;
    }
    .banner {
      text-align: center;
      margin-bottom: 20px;
    }
    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }
    .keyboard button {
      padding: 10px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .panel {
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
    }
    .panel textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      background-color: #333;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
    }
    .panel button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>My TTS</h1>
      <div class="progress-bar"></div>
    </div>
    <div class="grid-container">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div class="banner">
      <p class="clue-text"></p>
    </div>
    <div class="keyboard">
      <button data-key="Q">Q</button>
      <button data-key="W">W</button>
      <button data-key="E">E</button>
      <button data-key="R">R</button>
      <button data-key="T">T</button>
      <button data-key="Y">Y</button>
      <button data-key="U">U</button>
      <button data-key="I">I</button>
      <button data-key="O">O</button>
      <button data-key="P">P</button>
      <button data-key="A">A</button>
      <button data-key="S">S</button>
      <button data-key="D">D</button>
      <button data-key="F">F</button>
      <button data-key="G">G</button>
      <button data-key="H">H</button>
      <button data-key="J">J</button>
      <button data-key="K">K</button>
      <button data-key="L">L</button>
      <button data-key="Z">Z</button>
      <button data-key="X">X</button>
      <button data-key="C">C</button>
      <button data-key="V">V</button>
      <button data-key="B">B</button>
      <button data-key="N">N</button>
      <button data-key="M">M</button>
      <button data-key="Backspace">⌫</button>
    </div>
    <div class="panel">
      <textarea id="jsonInput" placeholder="Paste JSON baru di sini..."></textarea>
      <button id="loadJson">Muat Soal</button>
    </div>
  </div>
  <script type="module">
    import Phaser from 'https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.esm.js';

    const config = {
      type: Phaser.AUTO,
      width: 360,
      height: 640,
      backgroundColor: '#0f0e0c',
      scene: {
        preload: preload,
        create: create,
        update: update
      }
    };

    const game = new Phaser.Game(config);

    let gridData = {
      title: "TTS Nusantara",
      words: [
        { id: 1, word: "KUCING", clue: "Hewan peliharaan yang suka mengeong", row: 0, col: 0, dir: "across" },
        { id: 2, word: "KAPAL", clue: "Kendaraan yang berlayar di laut", row: 0, col: 0, dir: "down" },
        { id: 3, word: "ULAR", clue: "Reptil panjang tidak berkaki", row: 0, col: 3, dir: "down" },
        { id: 4, word: "RUMAH", clue: "Tempat berlindung dan tinggal manusia", row: 2, col: 1, dir: "across" },
        { id: 5, word: "ANGIN", clue: "Udara yang bergerak terasa sejuk", row: 2, col: 4, dir: "down" },
        { id: 6, word: "HUJAN", clue: "Air yang turun dari langit", row: 4, col: 0, dir: "across" },
        { id: 7, word: "NASI", clue: "Makanan pokok orang Indonesia", row: 4, col: 2, dir: "down" },
        { id: 8, word: "IKAN", clue: "Hewan air bersirip dan bersisik", row: 6, col: 1, dir: "across" },
        { id: 9, word: "LANGIT", clue: "Hamparan biru di atas kepala kita", row: 6, col: 3, dir: "down" },
        { id: 10, word: "POHON", clue: "Tumbuhan besar yang punya batang keras", row: 8, col: 0, dir: "across" }
      ]
    };

    let gridSize = 0;
    let cellSize = 0;
    let gridGraphics;
    let activeWord = null;
    let activeDirection = 'across';
    let userAnswers = {};
    let correctAnswers = {};

    function preload() {}

    function create() {
      calculateGridSize();
      drawGrid();
      setupKeyboard();
      setupPanel();
    }

    function update() {}

    function calculateGridSize() {
      let maxRow = 0;
      let maxCol = 0;
      gridData.words.forEach(word => {
        if (word.dir === 'across') {
          maxRow = Math.max(maxRow, word.row);
          maxCol = Math.max(maxCol, word.col + word.word.length - 1);
        } else {
          maxRow = Math.max(maxRow, word.row + word.word.length - 1);
          maxCol = Math.max(maxCol, word.col);
        }
      });
      gridSize = Math.max(maxRow, maxCol) + 1;
      cellSize = Math.floor(360 / gridSize);
    }

    function drawGrid() {
      gridGraphics = this.add.graphics();
      gridGraphics.lineStyle(2, 0xffffff);
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          gridGraphics.strokeRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    function setupKeyboard() {
      const keyboardButtons = document.querySelectorAll('.keyboard button');
      keyboardButtons.forEach(button => {
        button.addEventListener('click', () => {
          const key = button.dataset.key;
          if (key === 'Backspace') {
            handleBackspace();
          } else {
            handleKeyPress(key);
          }
        });
      });
    }

    function setupPanel() {
      const loadJsonButton = document.getElementById('loadJson');
      loadJsonButton.addEventListener('click', () => {
        const jsonInput = document.getElementById('jsonInput').value;
        try {
          const newData = JSON.parse(jsonInput);
          gridData = newData;
          resetGame();
        } catch (error) {
          alert('Invalid JSON format');
        }
      });
    }

    function handleBackspace() {}

    function handleKeyPress(key) {}

    function resetGame() {
      gridGraphics.clear();
      calculateGridSize();
      drawGrid();
      activeWord = null;
      activeDirection = 'across';
      userAnswers = {};
      correctAnswers = {};
    }
  </script>
</body>
</html>
