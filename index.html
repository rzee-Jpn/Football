<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TTS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0e0c;
      color: white;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
    .container {
      max-width: 768px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .grid-container {
      overflow: auto;
      margin-bottom: 20px;
    }
    .banner {
      text-align: center;
      margin-bottom: 20px;
    }
    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-bottom: 20px;
    }
    .keyboard button {
      padding: 10px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .panel {
      background-color: #222;
      padding: 20px;
      border-radius: 10px;
    }
    .panel textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 10px;
      background-color: #333;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
    }
    .panel button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-BkQSwzr1.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>My TTS</h1>
      <div class="progress-bar"></div>
    </div>
    <div class="grid-container">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div class="banner">
      <p class="clue-text"></p>
    </div>
    <div class="keyboard">
      <button data-key="Q">Q</button>
      <button data-key="W">W</button>
      <button data-key="E">E</button>
      <button data-key="R">R</button>
      <button data-key="T">T</button>
      <button data-key="Y">Y</button>
      <button data-key="U">U</button>
      <button data-key="I">I</button>
      <button data-key="O">O</button>
      <button data-key="P">P</button>
      <button data-key="A">A</button>
      <button data-key="S">S</button>
      <button data-key="D">D</button>
      <button data-key="F">F</button>
      <button data-key="G">G</button>
      <button data-key="H">H</button>
      <button data-key="J">J</button>
      <button data-key="K">K</button>
      <button data-key="L">L</button>
      <button data-key="Z">Z</button>
      <button data-key="X">X</button>
      <button data-key="C">C</button>
      <button data-key="V">V</button>
      <button data-key="B">B</button>
      <button data-key="N">N</button>
      <button data-key="M">M</button>
      <button data-key="Backspace">⌫</button>
    </div>
    <div class="panel">
      <textarea id="jsonInput" placeholder="Paste JSON baru di sini..."></textarea>
      <button id="loadJson">Muat Soal</button>
    </div>
  </div>
</body>
</html>
