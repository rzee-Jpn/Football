name: 🎮 AI Game Builder

on:
  push:
    paths:
      - "blueprint.md"
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ai_model:
        description: "Override AI model (opsional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🤖 AI Generate Game
        run: node scripts/ai-builder.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ github.event.inputs.ai_model || '' }}

      # Vanilla: ai-builder.js sudah copy ke dist/ otomatis
      # Phaser: perlu npm run build
      - name: 🔍 Detect if Phaser build needed
        id: detect
        run: |
          if [ -f ".ai-build-meta.json" ]; then
            STACK=$(node -e "const d=require('./.ai-build-meta.json'); console.log(d.techStack||'phaser')")
            echo "stack=$STACK" >> $GITHUB_OUTPUT
            echo "Tech stack: $STACK"
          else
            echo "stack=phaser" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Build (Phaser only)
        if: steps.detect.outputs.stack == 'phaser'
        id: build_phaser
        run: npm run build
        continue-on-error: true

      - name: 🔧 AI Auto-Fix (Phaser build error)
        if: steps.detect.outputs.stack == 'phaser' && steps.build_phaser.outcome == 'failure'
        run: node scripts/error-fixer.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_MODEL: ${{ github.event.inputs.ai_model || '' }}
          FIX_RETRIES: "3"

      - name: ✅ Verify dist/index.html
        run: |
          if [ -f "dist/index.html" ]; then
            echo "✅ dist/index.html ready"
            ls -la dist/
          else
            echo "❌ dist/index.html not found!"
            exit 1
          fi

      - name: 💾 Commit generated files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎮 [skip ci] AI generated game"
            git push origin HEAD
          fi

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "🚀 [skip ci] Deploy"

      - name: 📊 Summary
        run: |
          echo "## ✅ Deploy sukses!" >> $GITHUB_STEP_SUMMARY
          echo "🌐 https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
